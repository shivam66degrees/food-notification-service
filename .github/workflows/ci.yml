# Phase 6 — verify + Docker image build (push to GHCR on master/main)
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  packages: write

env:
  JAVA_VERSION: "21"
  IMAGE: ghcr.io/${{ github.repository_owner }}/food/notification

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Verify (unit + integration tests)
        run: mvn -B verify

  docker:
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  trigger-platform-deploy:
    name: Trigger platform CD
    needs: docker
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      vars.DEPLOY_REPO != ''
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deploy to food-platform-deploy
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          repository: ${{ vars.DEPLOY_REPO }}
          event-type: deploy-platform
          client-payload: |-
            {
              "image_tag": "latest",
              "image_registry": "ghcr.io/${{ github.repository_owner }}",
              "environment": "${{ vars.CD_DEPLOY_ENVIRONMENT }}",
              "triggered_by": "${{ github.repository }}",
              "triggered_sha": "${{ github.sha }}"
            }
